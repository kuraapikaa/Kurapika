# Affiliate panelinin testleri, GERÇEK Postgres'e karşı.
#
# Depolama katmanının iki uygulaması var (tablo ve JSON belgesi) ve
# ikisinin AYNI davranması gerekiyor. Bunu ancak veritabanı varken
# doğrulayabiliyoruz; `TEST_DATABASE_URL` yoksa o testler sessizce
# atlanıyor, yani veritabanısız bir CI "yeşil" der ama taşımanın en
# riskli kısmını hiç çalıştırmamış olur.
#
# Ana panelin testleri burada KOŞMUYOR: kendi servis bağımlılıkları
# doğrulanmadı, yeşil olduğu bilinmeden eklemek CI'ı gürültüye çevirir.
name: Testler

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: testler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  affiliate:
    name: Affiliate paneli
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        # Adim baslamadan once veritabaninin gercekten hazir olmasi
        # gerekiyor; yoksa ilk baglanti yarisi kaybediyor.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: affiliate-panel/backend/package-lock.json

      - name: Bağımlılıklar
        working-directory: affiliate-panel/backend
        run: npm ci

      - name: Tipler
        working-directory: affiliate-panel/backend
        run: npm run typecheck

      - name: Testler
        working-directory: affiliate-panel/backend
        env:
          # Testler bu adresten kendi veritabanlarini olusturuyor;
          # dosyalar paralel kostugu icin ortak bir sema paylasmiyorlar.
          TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/postgres
        run: npm test
