# Ana panelin testleri: sunucu ve istemci, birbirinden bagimsiz.
#
# Bu dosya eskiden YALNIZCA affiliate panelini test ediyordu ve ana
# panele hic dokunmuyordu. Affiliate ayri bir depoya ayrildiginda geriye
# var olmayan bir dizini arayan bir is kaldi; CI her itmede "Some
# specified paths were not resolved" ile dusuyordu. Yani kirmizi bir CI
# vardi ve kimseye bir sey anlatmiyordu.
#
# Eski notta ana panel testlerinin "yesil oldugu bilinmedigi" icin
# eklenmedigi yaziyordu. Artik biliniyor: sunucu 98 dosya / 1418 test,
# istemci 13 dosya / 121 test, ikisi de veritabani ISTEMEDEN geciyor.
# Bu yuzden burada `services:` yok — ihtiyac duyulmayan bir Postgres'i
# ayaga kaldirmak her kosuyu yavaslatir ve yeni bir dusme sebebi ekler.
#
# Sunucu ve istemci AYRI isler: biri duserse digerinin sonucu yine de
# gorunur, "test dustu" demek yerine hangi tarafin dustugu okunur.
name: Testler

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: testler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sunucu:
    name: Sunucu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Bağımlılıklar
        working-directory: server
        run: npm ci

      - name: Tipler
        working-directory: server
        run: npm run typecheck

      - name: Testler
        working-directory: server
        run: npm test

  istemci:
    name: İstemci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Bağımlılıklar
        working-directory: client
        run: npm ci

      # `tsc -b` derleme yapiyor; `test:run` izlemesiz tek gecis.
      - name: Tipler
        working-directory: client
        run: npx tsc -b

      - name: Testler
        working-directory: client
        run: npm run test:run
